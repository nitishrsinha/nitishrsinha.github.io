<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Quantitative Investment Strategies</title>
    <meta name="robots" content="noindex">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 16px 120px;
            color: #2c2c2c;
            background-color: #ffffff;
        }

        h1 {
            color: #1565c0;
            margin: 0 0 4px;
            font-size: 1.4em;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #5a5a5a;
            margin-bottom: 24px;
        }

        .notice {
            border: 1px dashed #ccc;
            border-radius: 10px;
            padding: 18px 20px;
            color: #5a5a5a;
        }

        .notice.error {
            border: 1px solid #e53935;
            color: #b71c1c;
            background: #fdecea;
        }

        .notice.success {
            border: 1px solid #43a047;
            color: #1b5e20;
            background: #e8f5e9;
        }

        label.field {
            display: block;
            margin-bottom: 14px;
            font-size: 0.95em;
            color: #5a5a5a;
        }

        label.field input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            padding: 12px;
            font-size: 16px; /* 16px stops iOS zooming on focus */
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .question {
            margin: 28px 0;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
        }

        .question p {
            margin: 0 0 12px;
            font-weight: 500;
        }

        .question pre {
            margin: 0 0 12px;
            padding: 10px 12px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 13px;
            overflow-x: auto;
        }

        .choice {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
        }

        .choice input {
            margin-top: 4px;
            flex-shrink: 0;
        }

        .choice:has(input:checked) {
            border-color: #1565c0;
            background: #e3f2fd;
        }

        .choice.static {
            cursor: default;
            display: block;
        }

        .choice.correct {
            border-color: #43a047;
            background: #e8f5e9;
        }

        .choice.wrong {
            border-color: #e53935;
            background: #fdecea;
        }

        .tag {
            display: block;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 2px;
        }

        .correct .tag { color: #1b5e20; }
        .wrong .tag { color: #b71c1c; }

        .why {
            margin: 10px 0 0;
            font-size: 0.95em;
            color: #5a5a5a;
        }

        .score {
            font-size: 1.3em;
            color: #1565c0;
            margin: 0 0 4px;
        }

        .submit-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: #ffffff;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .submit-bar span {
            color: #5a5a5a;
            font-size: 0.95em;
        }

        button {
            padding: 12px 22px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: #ffffff;
            cursor: pointer;
        }

        button:disabled {
            background: #9e9e9e;
            cursor: default;
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <h1 id="title">Quiz</h1>
    <div class="subtitle">BUFN736 Quantitative Investment Strategies</div>

    <div id="status" class="notice">Loading&hellip;</div>
    <p id="receipt-note" hidden>To see your answers and the explanations later, come back to this page on this phone, or save <a id="receipt-link">your review link</a>.</p>

    <form id="quiz" hidden novalidate>
        <label class="field">Full name
            <input id="name" autocomplete="name" required>
        </label>
        <label class="field">Email
            <input id="email" type="email" autocomplete="email" inputmode="email" required>
        </label>
        <div id="questions"></div>
        <div class="submit-bar">
            <span id="progress"></span>
            <button id="submit" type="submit">Submit</button>
        </div>
    </form>

    <div id="review" hidden></div>

    <script>
        const WORKER_URL = "https://qis-quiz.nitish-ranjan.workers.dev";
        const POLL_MS = 5000;

        const week = new URLSearchParams(location.search).get("week") || "week01";
        const draftKey = `qis-quiz-${week}`;
        const receiptKey = `qis-quiz-${week}-receipt`;
        const $ = (id) => document.getElementById(id);

        let questions = [];

        function setStatus(text, kind) {
            const el = $("status");
            el.textContent = text;
            el.className = "notice" + (kind ? " " + kind : "");
            el.hidden = !text;
        }

        function loadDraft() {
            try { return JSON.parse(localStorage.getItem(draftKey)) || {}; } catch { return {}; }
        }

        function saveDraft() {
            try { localStorage.setItem(draftKey, JSON.stringify(collect())); } catch { /* private mode */ }
        }

        // The receipt (email + token from the worker) proves which submission is
        // yours in review mode. It comes from this phone's storage or from the
        // review link (#email=...&token=...), which never reaches the server's logs.
        function loadReceipt() {
            const hash = new URLSearchParams(location.hash.slice(1));
            if (hash.get("email") && hash.get("token")) {
                return { email: hash.get("email"), token: hash.get("token") };
            }
            try { return JSON.parse(localStorage.getItem(receiptKey)); } catch { return null; }
        }

        function saveReceipt(receipt) {
            try { localStorage.setItem(receiptKey, JSON.stringify(receipt)); } catch { /* private mode */ }
        }

        function showReceiptLink(receipt) {
            const link = new URL(location.href);
            link.hash = new URLSearchParams(receipt).toString();
            $("receipt-link").href = link.href;
            $("receipt-note").hidden = false;
        }

        function shuffle(items) {
            const a = items.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function collect() {
            const answers = {};
            for (const q of questions) {
                const picked = document.querySelector(`input[name="${q.id}"]:checked`);
                if (picked) answers[q.id] = Number(picked.value);
            }
            return { name: $("name").value, email: $("email").value, answers };
        }

        function unanswered() {
            const answers = collect().answers;
            return questions.filter((q) => !q.bonus && !(q.id in answers)).length;
        }

        function updateProgress() {
            const required = questions.filter((q) => !q.bonus).length;
            $("progress").textContent = `${required - unanswered()} of ${required} answered`;
        }

        // Question and choice order are shuffled per student, with bonus questions
        // kept at the end; answers are sent as each choice's original index, so
        // grading is unaffected.
        function render(quiz) {
            questions = quiz.questions;
            const draft = loadDraft();
            $("name").value = draft.name || "";
            $("email").value = draft.email || "";

            const container = $("questions");
            container.replaceChildren();
            const ordered = [
                ...shuffle(questions.filter((q) => !q.bonus)),
                ...shuffle(questions.filter((q) => q.bonus)),
            ];
            let number = 0;
            ordered.forEach((q) => {
                const block = document.createElement("div");
                block.className = "question";
                const text = document.createElement("p");
                text.textContent = q.bonus ? `Bonus: ${q.q}` : `${++number}. ${q.q}`;
                block.append(text);
                if (q.code) {
                    const pre = document.createElement("pre");
                    pre.textContent = q.code;
                    block.append(pre);
                }

                shuffle(q.choices.map((c, i) => ({ c, i }))).forEach(({ c, i }) => {
                    const label = document.createElement("label");
                    label.className = "choice";
                    const input = document.createElement("input");
                    input.type = "radio";
                    input.name = q.id;
                    input.value = i;
                    input.checked = draft.answers && draft.answers[q.id] === i;
                    const span = document.createElement("span");
                    span.textContent = c;
                    label.append(input, span);
                    block.append(label);
                });
                container.append(block);
            });

            $("title").textContent = quiz.title;
            setStatus("");
            $("quiz").hidden = false;
            updateProgress();
        }

        async function fetchMine(receipt) {
            if (!receipt) return null;
            try {
                const res = await fetch(`${WORKER_URL}/quiz/mine`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ week, ...receipt }),
                });
                return res.ok ? await res.json() : null;
            } catch {
                return null;
            }
        }

        // Review lists questions in their original order with the correct answer,
        // the student's own pick (when we have their receipt) and the explanation.
        function renderReview(quiz, mine) {
            const container = $("review");
            container.replaceChildren();

            if (mine) {
                const score = document.createElement("p");
                score.className = "score";
                score.textContent = `${mine.name}: ${mine.score} / ${mine.outOf}`;
                container.append(score);
                setStatus("");
            } else {
                setStatus("Showing the answer key. To see your own answers, open this page on the phone you submitted from, or use the review link you saved.");
            }

            let number = 0;
            quiz.questions.forEach((q) => {
                const block = document.createElement("div");
                block.className = "question";
                const text = document.createElement("p");
                text.textContent = q.bonus ? `Bonus: ${q.q}` : `${++number}. ${q.q}`;
                block.append(text);
                if (q.code) {
                    const pre = document.createElement("pre");
                    pre.textContent = q.code;
                    block.append(pre);
                }

                const picked = mine ? mine.answers[q.id] : undefined;
                q.choices.forEach((c, i) => {
                    const row = document.createElement("div");
                    row.className = "choice static";
                    row.textContent = c;
                    let tag = "";
                    if (i === q.answer) {
                        row.classList.add("correct");
                        tag = i === picked ? "✓ Your answer, correct" : "✓ Correct answer";
                    } else if (i === picked) {
                        row.classList.add("wrong");
                        tag = "✗ Your answer";
                    }
                    if (tag) {
                        const span = document.createElement("span");
                        span.className = "tag";
                        span.textContent = tag;
                        row.append(span);
                    }
                    block.append(row);
                });

                if (mine && picked === undefined) {
                    const skipped = document.createElement("p");
                    skipped.className = "why";
                    skipped.textContent = "You left this one blank.";
                    block.append(skipped);
                }
                if (q.why) {
                    const why = document.createElement("p");
                    why.className = "why";
                    why.textContent = `Why: ${q.why}`;
                    block.append(why);
                }
                container.append(block);
            });

            $("quiz").hidden = true;
            $("receipt-note").hidden = true;
            container.hidden = false;
        }

        async function load() {
            try {
                const res = await fetch(`${WORKER_URL}/quiz?week=${encodeURIComponent(week)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Could not load the quiz.");
                if (data.title) $("title").textContent = data.title;
                const receipt = loadReceipt();
                if (data.state === "review") return renderReview(data, await fetchMine(receipt));
                if (receipt) {
                    // already submitted: keep polling so the review appears on its own
                    setStatus("Submitted. Your answers and the explanations will appear here when your instructor opens the review.", "success");
                    showReceiptLink(receipt);
                } else if (data.state === "open") {
                    return render(data);
                } else {
                    setStatus("The quiz hasn't opened yet. Keep this page open; it will appear automatically.");
                }
            } catch (err) {
                setStatus(`${err.message} Retrying…`, "error");
            }
            setTimeout(load, POLL_MS);
        }

        $("quiz").addEventListener("change", () => { saveDraft(); updateProgress(); });
        $("quiz").addEventListener("input", saveDraft);

        $("quiz").addEventListener("submit", async (event) => {
            event.preventDefault();
            const body = { week, ...collect() };
            const missing = unanswered();
            if (!body.name.trim() || !body.email.trim()) {
                setStatus("Please enter your name and email at the top.", "error");
                return window.scrollTo({ top: 0, behavior: "smooth" });
            }
            if (missing > 0 && !confirm(`${missing} question${missing > 1 ? "s are" : " is"} unanswered and will count as wrong. Submit anyway?`)) {
                return;
            }

            $("submit").disabled = true;
            try {
                const res = await fetch(`${WORKER_URL}/quiz`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (res.status === 409) {
                    $("quiz").hidden = true;
                    setStatus(data.error, "error");
                    return window.scrollTo({ top: 0, behavior: "smooth" });
                }
                if (!res.ok) throw new Error(data.error || "Submission failed.");
                try { localStorage.removeItem(draftKey); } catch { /* ignore */ }
                const receipt = { email: body.email.trim().toLowerCase(), token: data.token };
                saveReceipt(receipt);
                $("quiz").hidden = true;
                setStatus(`Submitted. Thank you, ${body.name.trim()}.`, "success");
                showReceiptLink(receipt);
                setTimeout(load, POLL_MS);
            } catch (err) {
                setStatus(`${err.message} Your answers are still here; try again.`, "error");
                $("submit").disabled = false;
            }
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        load();
    </script>
</body>
</html>
